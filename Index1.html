<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Diagnostic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #020504;
    color: #b8ffc8;
    font-family: "JetBrains Mono", monospace;
    overflow-x: hidden;
}


/* =====================================================
   TERMINAL BACKGROUND
===================================================== */

.terminal {
    position: fixed;
    inset: 0;

    overflow: hidden;

    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,100,.08),
            transparent 55%
        ),
        #020504;
}


/* Scanline effect */

.terminal::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(0,255,100,.025) 4px
        );
}


/* Green glow */

.terminal::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    box-shadow:
        inset 0 0 100px rgba(0,255,100,.08);
}


/* =====================================================
   COMMAND AREA
===================================================== */

#commands {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    opacity: .75;

    font-size: 12px;
    line-height: 1.7;

    word-break: break-word;
}

.command {
    color: #72ff91;
}

.command.warning {
    color: #ffe66d;
}

.command.error {
    color: #ff7070;
}

.command.system {
    color: #75c9ff;
}


/* =====================================================
   MAIN WARNING
===================================================== */

.warning-screen {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.72);

    backdrop-filter: blur(7px);

    opacity: 0;

    visibility: hidden;

    transition: .5s;
}

.warning-screen.show {
    opacity: 1;
    visibility: visible;
}


/* =====================================================
   WARNING CARD
===================================================== */

.warning-card {

    width: 100%;
    max-width: 600px;

    padding: 35px;

    text-align: center;

    border: 1px solid rgba(255,70,70,.5);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(30,5,5,.97),
            rgba(8,8,8,.97)
        );

    box-shadow:
        0 0 80px rgba(255,0,0,.18),
        inset 0 0 30px rgba(255,0,0,.04);
}


/* =====================================================
   WARNING ICON
===================================================== */

.warning-icon {

    width: 75px;
    height: 75px;

    margin: 0 auto 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px solid #ff4040;

    color: #ff4040;

    box-shadow:
        0 0 30px rgba(255,0,0,.3);
}

.warning-icon svg {

    width: 38px;
    height: 38px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =====================================================
   TEXT
===================================================== */

.warning-card .small-title {

    color: #ff5656;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;
}

.warning-card h1 {

    margin-top: 12px;

    color: #ff5252;

    font-family: "Poppins", sans-serif;

    font-size: clamp(28px, 7vw, 48px);

    line-height: 1.1;

    font-weight: 800;

    text-shadow:
        0 0 25px rgba(255,0,0,.35);
}

.warning-card p {

    margin-top: 18px;

    color: #c7c7c7;

    font-size: 13px;

    line-height: 1.7;
}


/* =====================================================
   POPUP BUTTON
===================================================== */

.dismiss-btn {

    margin-top: 28px;

    min-width: 170px;

    padding: 14px 24px;

    border-radius: 10px;

    border: 1px solid #ff4444;

    background: rgba(255,50,50,.08);

    color: #ff7777;

    font-family: "Poppins", sans-serif;

    font-weight: 700;

    cursor: pointer;

    transition: .25s;
}

.dismiss-btn:hover {

    background: #ff4444;

    color: white;

    box-shadow:
        0 0 30px rgba(255,0,0,.3);
}


/* =====================================================
   AGREEMENT SCREEN
===================================================== */

.agreement {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.8);

    backdrop-filter: blur(10px);

    opacity: 0;

    visibility: hidden;

    transition: .4s;
}

.agreement.show {

    opacity: 1;

    visibility: visible;
}


.agreement-card {

    width: 100%;
    max-width: 500px;

    padding: 35px;

    text-align: center;

    border: 1px solid #303638;

    border-radius: 18px;

    background: #080c0a;

    box-shadow:
        0 30px 100px rgba(0,0,0,.7);
}

.agreement-card h2 {

    color: #ffffff;

    font-family: "Poppins", sans-serif;

    font-size: 25px;
}

.agreement-card p {

    margin-top: 12px;

    color: #8c9690;

    font-size: 13px;

    line-height: 1.6;
}


/* =====================================================
   BUTTONS
===================================================== */

.actions {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-top: 25px;
}

.actions button {

    min-height: 50px;

    border-radius: 10px;

    font-family: "Poppins", sans-serif;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.agree {

    border: none;

    color: #001b08;

    background: #4ade80;
}

.agree:hover {

    transform: translateY(-2px);

    box-shadow:
        0 10px 25px rgba(74,222,128,.25);
}

.no {

    border: 1px solid #303936;

    color: #aeb8b2;

    background: #111614;
}

.no:hover {

    border-color: #ff5d5d;

    color: #ff7373;
}


/* =====================================================
   FINAL PRANK MESSAGE
===================================================== */

.reveal {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: #050706;

    opacity: 0;

    visibility: hidden;

    transition: .5s;
}

.reveal.show {

    opacity: 1;

    visibility: visible;
}

.reveal-box {

    max-width: 600px;

    text-align: center;
}

.reveal-icon {

    width: 90px;
    height: 90px;

    margin: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #064e3b;

    color: #4ade80;

    border: 1px solid #10b981;

    box-shadow:
        0 0 50px rgba(16,185,129,.25);
}

.reveal-icon svg {

    width: 45px;
    height: 45px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.reveal h1 {

    margin-top: 25px;

    color: #4ade80;

    font-family: "Poppins", sans-serif;

    font-size: clamp(35px, 8vw, 65px);
}

.reveal p {

    margin-top: 15px;

    color: #a9b2ac;

    font-family: "Poppins", sans-serif;

    font-size: 15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 500px) {

    .terminal {
        padding: 12px;
    }

    #commands {
        font-size: 10px;
    }

    .warning-card,
    .agreement-card {
        padding: 27px 20px;
    }

    .actions {
        grid-template-columns: 1fr;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     FAKE TERMINAL
===================================================== -->

<div class="terminal">

    <div id="commands"></div>

</div>



<!-- =====================================================
     WARNING
===================================================== -->

<div class="warning-screen" id="warningScreen">

    <div class="warning-card">

        <div class="warning-icon">

            <svg viewBox="0 0 24 24">

                <path
                    d="M12 3 2.5 20h19L12 3z">
                </path>

                <path
                    d="M12 9v4">
                </path>

                <path
                    d="M12 17h.01">
                </path>

            </svg>

        </div>


        <div class="small-title">
            Security Alert
        </div>


        <h1>
            DEVICE HACKED
        </h1>


        <p>
            I know you love clicking public links.
            <br>
            A suspicious session has been detected.
        </p>


        <button
            class="dismiss-btn"
            id="dismissBtn">

            Dismiss

        </button>

    </div>

</div>



<!-- =====================================================
     AGREEMENT
===================================================== -->

<div class="agreement" id="agreement">

    <div class="agreement-card">

        <h2>
            Continue with the security process?
        </h2>

        <p>
            Choose an option below to continue.
        </p>


        <div class="actions">

            <button
                class="agree"
                id="agreeBtn">

                Agree

            </button>


            <button
                class="no"
                id="noBtn">

                No

            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     FINAL REVEAL
===================================================== -->

<div class="reveal" id="reveal">

    <div class="reveal-box">

        <div class="reveal-icon">

            <svg viewBox="0 0 24 24">

                <path
                    d="M20 6 9 17l-5-5">
                </path>

            </svg>

        </div>


        <h1>
            OSAOPA!
        </h1>


        <p>
            It's just a prank.
            <br><br>
            Your device was never hacked.
        </p>

    </div>

</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const commands =
    document.getElementById("commands");

const warningScreen =
    document.getElementById("warningScreen");

const dismissBtn =
    document.getElementById("dismissBtn");

const agreement =
    document.getElementById("agreement");

const agreeBtn =
    document.getElementById("agreeBtn");

const noBtn =
    document.getElementById("noBtn");

const reveal =
    document.getElementById("reveal");


/* =====================================================
   FAKE TERMINAL COMMANDS

   These are ONLY visual text.
   Nothing is actually executed.
===================================================== */

const commandList = [

    ["[BOOT] Initializing secure terminal...", "system"],

    ["[SYS] Loading diagnostic interface...", "system"],

    ["[AUTH] Checking session token...", "command"],

    ["[NET] Establishing fictional secure tunnel...", "command"],

    ["[SCAN] Running simulated system check...", "command"],

    ["[SCAN] Checking fictional memory modules...", "command"],

    ["[SCAN] Checking fictional network state...", "command"],

    ["[PROC] Reading simulated process table...", "command"],

    ["[SEC] Reviewing simulated security status...", "warning"],

    ["[NET] Simulated connection established.", "command"],

    ["[AUTH] Session verification complete.", "system"],

    ["[WARN] Suspicious activity detected.", "warning"],

    ["[WARN] Preparing security notification...", "warning"],

    ["[SYS] Generating security report...", "command"],

    ["[SYS] Report generated.", "system"],

    ["[ALERT] SECURITY EVENT CREATED", "error"]

];


let commandIndex = 0;


/* =====================================================
   ADD COMMAND
===================================================== */

function addCommand() {

    if (commandIndex >= commandList.length) {

        setTimeout(() => {

            warningScreen.classList.add("show");

        }, 800);

        return;
    }


    const [text, type] =
        commandList[commandIndex];


    const line =
        document.createElement("div");


    line.className =
        "command " + type;


    line.textContent =
        "> " + text;


    commands.appendChild(line);


    commandIndex++;


    /*
       Keep terminal from becoming
       excessively large.
    */

    if (commands.children.length > 32) {

        commands.removeChild(
            commands.firstChild
        );

    }


    const delay =
        Math.floor(
            Math.random() * 400
        ) + 180;


    setTimeout(
        addCommand,
        delay
    );
}


/* =====================================================
   START AUTOMATICALLY
===================================================== */

setTimeout(
    addCommand,
    600
);


/* =====================================================
   DISMISS WARNING
===================================================== */

dismissBtn.addEventListener(
    "click",
    () => {

        warningScreen.classList.remove("show");

        setTimeout(() => {

            agreement.classList.add("show");

        }, 450);

    }
);


/* =====================================================
   AGREE PROCESS
===================================================== */

let agreeStep = 0;


const agreeMessages = [

    "Security confirmation required.",

    "Confirm that you want to continue.",

    "Final confirmation required.",

    "Almost complete.",

    "Security simulation complete."

];


agreeBtn.addEventListener(
    "click",
    () => {

        if (agreeStep < agreeMessages.length) {

            agreeBtn.textContent =
                agreeMessages[agreeStep];

            agreeStep++;

            return;
        }


        /*
           Final reveal
        */

        agreement.classList.remove("show");

        setTimeout(() => {

            reveal.classList.add("show");

        }, 400);

    }
);


/* =====================================================
   NO BUTTON

   Harmless prank response.
===================================================== */

noBtn.addEventListener(
    "click",
    () => {

        noBtn.textContent =
            "Ooh, I see you...";

        setTimeout(() => {

            noBtn.textContent =
                "Ukubweza moto?";

        }, 1200);

        

        setTimeout(() => {

            noBtn.textContent =
                "Koma tiona kt ufikanazo nazo pat";

        }, 3600);

    }
);

</script>

</body>
</html>
